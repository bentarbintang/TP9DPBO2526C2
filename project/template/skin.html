<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Daftar Kandidat Karyawan</title>
  <!-- Gaya halaman (CSS di dalam file agar template mandiri). -->
  <style>
    /* Variabel warna, radius, dan font yang dipakai di seluruh halaman. */
    :root{
      --bg: #f7f8fb;
      --card: #ffffff;
      --muted: #6b7280;
      --accent: #2563eb;
      --danger: #dc2626;
      --border: #e6e9ef;
      --radius: 8px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      color-scheme: light;
    }
    html,body{height:100%;margin:0;background:var(--bg);color:#0f172a;}
    /* Pembungkus halaman (lebar maksimum, rata tengah) dan kartu putih. */
    .container{max-width:980px;margin:36px auto;padding:18px;}
    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:20px;
      box-shadow: 0 1px 3px rgba(16,24,40,0.04);
    }
    h1{margin:0 0 14px 0;font-size:20px;color:#0f172a;}
    table{width:100%;border-collapse:collapse;font-size:14px;}
    /* Gaya tabel daftar. */
    thead th{text-align:left;padding:12px 10px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--border);}
    tbody td{padding:12px 10px;border-bottom:1px solid var(--bg);vertical-align:middle;}
    tbody tr:last-child td{border-bottom:0;}
    .col-id{width:48px;color:var(--muted);}
    .col-actions{width:160px;text-align:right;}
    /* Gaya tombol (Edit, Hapus, Tambah). */
    .btn{display:inline-block;padding:7px 12px;border-radius:6px;border:1px solid transparent;font-size:13px;cursor:pointer;text-decoration:none;}
    .btn-edit{background:transparent;color:var(--accent);font-weight:600;}
    .btn-delete{background:transparent;color:var(--danger);font-weight:600;border:none;}
    .btn-add{background:var(--accent);color:#fff;font-weight:600;}
    /* Gaya baris bawah kartu (total data + tombol tambah). */
    .footer-bar{margin-top:16px;display:flex;justify-content:space-between;align-items:center;padding-top:12px;border-top:1px solid var(--border);}
    tbody tr:hover td{background:rgba(37,99,235,0.02);}
    /* Gaya tab navigasi antarmodul (Data Kandidat / Data Lowongan). */
    .tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--border);}
    .tab{padding:9px 16px;font-size:14px;font-weight:600;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px;}
    .tab:hover{color:#0f172a;}
    .tab.active{color:var(--accent);border-bottom-color:var(--accent);}
    /* Gaya kotak pesan: hijau untuk sukses, merah untuk error. */
    .alert{padding:10px 14px;border-radius:6px;font-size:13px;margin-bottom:14px;border:1px solid transparent;}
    .alert-success{background:#ecfdf5;color:#065f46;border-color:#a7f3d0;}
    .alert-error{background:#fef2f2;color:#991b1b;border-color:#fecaca;}
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <!-- Tab navigasi: pindah antara modul Kandidat dan modul Lowongan (tab aktif diberi kelas active). -->
      <nav class="tabs">
        <a href="index.php?module=kandidat" class="tab active">Data Kandidat</a>
        <a href="index.php?module=lowongan" class="tab">Data Lowongan</a>
      </nav>

      <!-- Tempat pesan sukses/error (HTML dirakit Presenter, diisi View). -->
      {{ALERT}}

      <h1>Daftar Kandidat Karyawan</h1>

      <!-- Tabel daftar (dapat di-scroll horizontal di layar kecil). -->
      <div style="overflow:auto;">
        <table>
          <!-- Kepala tabel: judul kolom. -->
          <thead>
            <tr>
              <th class="col-id">No</th>
              <th>Nama</th>
              <th>Posisi Dilamar</th>
              <th>Domisili</th>
              <th>Skor Tes</th>
              <th>Pengalaman</th>
              <th class="col-actions">Aksi</th>
            </tr>
          </thead>
          <tbody>
            <!-- Tempat baris tabel: potongan <tr> dirakit oleh Presenter. -->
            {{TABLE_ROWS}}
          </tbody>
        </table>
      </div>

      <!-- Baris bawah: total data (diisi View) dan tombol menuju form tambah. -->
      <div class="footer-bar">
        <div style="color:var(--muted);font-size:13px">
          Total Kandidat: <strong style="color:#0f172a">{{TOTAL_DATA}}</strong>
        </div>
        <div>
          <a href="index.php?screen=add" class="btn btn-add">+ Tambah Kandidat</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
